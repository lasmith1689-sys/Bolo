name: TTS probe

# Research run, not part of the app build: tries each open Gujarati TTS candidate on a plain
# Ubuntu runner and pushes its WAVs and a JSON report to the probe/<engine> branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tts-probe.yml
      - tools/tts/probe2.py

permissions:
  contents: write

concurrency:
  group: tts-probe-${{ github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        engine: [indictts]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libsndfile1 espeak-ng >/dev/null
          python -m pip install -q --upgrade pip
          {
            pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu &&
            case "$ENGINE" in
              svara)    pip install "transformers>=4.46,<5" accelerate snac soundfile librosa ;;
              indictts) pip install "coqui-tts==0.25.3" "transformers==4.46.2" soundfile librosa ;;
              parler)   pip install "git+https://github.com/huggingface/parler-tts.git" soundfile librosa ;;
            esac
          } > pip.log 2>&1 || { echo "::error title=pip install::$(grep -iE 'error|conflict|requires' pip.log | tail -15 | sed 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g')"; tail -40 pip.log; exit 1; }
          pip list 2>/dev/null | grep -iE "^(torch|transformers|coqui|parler|snac) " || true
          nproc; free -g; df -h / | tail -1

      - name: Probe
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python tools/tts/probe2.py ${{ matrix.engine }}

      - name: Publish results to probe/${{ matrix.engine }}
        if: always()
        run: |
          dir="probe-out/${{ matrix.engine }}"
          [ -d "$dir" ] || exit 0
          mkdir -p /tmp/pub && cp -r "$dir"/* /tmp/pub/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan "probe/${{ matrix.engine }}"
          git rm -rfq . >/dev/null
          cp -r /tmp/pub/* .
          git add -A
          git commit -qm "TTS probe results for ${{ matrix.engine }} (run ${{ github.run_id }})"
          git push -qf origin "probe/${{ matrix.engine }}"
