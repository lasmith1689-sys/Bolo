name: Audio

# Generates the recorded Gujarati clips (two voices, one per conversation speaker) with an open
# neural TTS model on Ubuntu runners, then trims, normalises, encodes them to AAC, verifies every
# line has a clip and none is near-silent, and commits them to App/Resources/Audio.
#
# Only missing or stale clips are generated, so editing content.json re-records just the lines that
# changed. The commit is pushed with GITHUB_TOKEN, which does not start CI: push any ordinary commit
# (or run CI by hand) afterwards to rebuild the app with the new clips.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: TTS engine
        type: choice
        options: [svara, indictts, mms]
        default: svara
      force:
        description: Re-record every clip, not just missing or stale ones
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Packages/BoloKit/Sources/BoloKit/Resources/content.json
      - tools/tts/synthesize.py
      - .github/workflows/audio.yml

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

env:
  ENGINE: ${{ inputs.engine || 'svara' }}
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        run: |
          shards=4
          if [ "$ENGINE" = svara ]; then shards=16; fi
          python3 tools/tts/synthesize.py plan --shards "$shards" ${{ inputs.force && '--force' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: tts-work/plan.json

  generate:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: plan
          path: tts-work
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libsndfile1 >/dev/null
          python -m pip install -q --upgrade pip
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          case "$ENGINE" in
            indictts) pip install -q "coqui-tts==0.25.3" "transformers==4.46.2" click soundfile librosa ;;
            svara)    pip install -q "transformers>=4.46,<5" accelerate snac soundfile librosa ;;
            mms)      pip install -q "transformers>=4.46,<5" soundfile librosa ;;
          esac
      - name: Synthesize shard ${{ matrix.shard }}
        run: python tools/tts/synthesize.py generate --shard ${{ matrix.shard }} --score
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.shard }}
          path: tts-work/raw

  finalize:
    needs: [plan, generate]
    if: always() && needs.plan.result == 'success' && (needs.generate.result == 'success' || needs.generate.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: plan
          path: tts-work
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: raw-*
          path: tts-work/raw
          merge-multiple: true
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null
          pip install -q --break-system-packages numpy soundfile
      - name: Trim, normalise, encode and verify
        run: python3 tools/tts/synthesize.py finalize
      - name: Commit the clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A App/Resources/Audio
          if git diff --cached --quiet; then
            echo "Clips already up to date."
            exit 0
          fi
          count=$(ls App/Resources/Audio/*.m4a | wc -l | tr -d ' ')
          git commit -qm "Audio: $count recorded clips ($ENGINE)" -m "Generated by the Audio workflow, run ${{ github.run_id }}."
          for attempt in 1 2 3 4 5; do
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 10))
            git pull -q --rebase origin main
          done
          echo "::error::Could not push the clips to main."
          exit 1
